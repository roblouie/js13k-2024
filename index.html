<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=0">
    <style>
        * {
            user-select: none;
            overscroll-behavior: none;
        }

        body {
            margin: 0;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        /* Portrait */
        @media screen and (orientation:portrait) {
            body {
                align-items: start;
            }

            gameboy-d-pad {
                position: absolute;
                left: 20px;
                bottom: 30%;
            }
        }
        /* Landscape */
        @media screen and (orientation:landscape) {
            gameboy-d-pad {
                position: absolute;
                left: 20px;
                bottom: 30%;
            }

            .flashlight {
                position: absolute;
                right: 30px;
                bottom: 30%;
            }
        }
    </style>
</head>
<body>
<canvas id="c3d" width="1920" height="1080" style="width: min(100vw, calc(100vh * 16/9));position: absolute;aspect-ratio: 16/9;color: white;"></canvas>
<div id="tmpl" style="width: min(100vw, calc(100vh * 16/9));position: absolute;aspect-ratio: 16/9;color: white;">
    <div id="roomNumber" style="font-size: 30px; text-align: center; position: absolute; bottom: 50px; right: 80px;"></div>

    <div style="font-size: 40px; text-align: center; position: absolute; bottom: 10px; right: 280px; color: #b00;">
        &#9829; <div id="health" style="position: absolute; bottom: 13px; left: 30px; width: 200px; height: 20px; background-color: #b00;"></div>
    </div>

    <div id="bottomHud" style="font-size: 30px; text-align: center; position: absolute; bottom: 20px; width: 100%; white-space: pre"></div>
</div>
<gameboy-d-pad></gameboy-d-pad>
<round-button class="flashlight" label="&#x1F526;"></round-button>

<script type="module" src="/src/index.ts"></script>
</body>
